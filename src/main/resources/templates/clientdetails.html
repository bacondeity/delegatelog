
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelegateLog - Client Details</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>

    <h1>DelegateLog</h1>

    <nav>
        <a th:href="@{/menu}">Main Menu</a>
        <a th:href="@{/clients}">Back to Client List</a>
        <a th:href="@{/client/edit/{id}(id=${client.id})}">
            Edit Client
        </a>
    </nav>

</header>

<div class="details-container">

    <h1>Client Details</h1>

    <h2>
        <span th:text="${client.fname}"></span>
        <span th:text="${client.lname}"></span>
    </h2>

    <div class="detail-row">
        <span class="detail-label">Client ID:</span>
        <span class="detail-value" th:text="${client.id}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Submission Date/Time:</span>
        <span class="detail-value" th:text="${client.submission}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Crisis Worker:</span>
        <span class="detail-value" th:text="${client.crisisworker}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Age:</span>
        <span class="detail-value" th:text="${client.age}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Sex:</span>
        <span class="detail-value" th:text="${client.sex}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Jurisdiction:</span>
        <span class="detail-value" th:text="${client.jurisdiction}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Facility:</span>
        <span class="detail-value" th:text="${client.facility}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Ideation:</span>
        <span class="detail-value" th:text="${client.ideation}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">With Plan:</span>
        <span class="detail-value" th:text="${client.actionable}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Notes:</span>
        <span class="detail-value" th:text="${client.notes}"></span>
    </div>

    <div class="detail-row">
        <span class="detail-label">Final Determination:</span>
        <span class="detail-value"
              th:text="${client.determination ? 'Approved' : 'Not Approved'}">
        </span>
    </div>

</div>

</body>
</html>
