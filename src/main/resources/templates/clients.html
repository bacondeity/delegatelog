<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client List</title>
</head>
<body>
    <header>
        <h1>Client List</h1>
        <nav>
            <a th:href="@{/menu}">Main Menu</a>
        </nav>
    </header>

    <form method="post" th:action="@{/client/search}">
        <input type="search" placeholder="Enter search criteria" name="search"><button type="submit">Search</button>
    </form>

    <div th:each="client: ${clients}">
        <p>
        <span th:text="${client.fname}"></span>
        <span th:text="${client.lname}"></span>

            <a th:href="@{/client/{id}(id=${client.id})}">View Details</a>
            <a th:href="@{'/client/edit/' + ${client.id}}">Edit</a>
        </p>
    </div>

</body>
</html>
