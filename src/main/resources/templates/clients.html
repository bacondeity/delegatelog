<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client List</title>
</head>
<body>
    <h1>Client List</h1>

    <div th:each="client: ${clients}">
        <p>
        <span th:text="${client.fname}"></span>
        <span th:text="${client.lname}"></span>

            <a th:href="@{/client/{id}(id=${client.id})}">View Details</a>
            <a th:href="@{'/client/edit/' + ${client.id}}">Edit</a>
        </p>
    </div>

</body>
</html>
