
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelegateLog Main Menu</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h1>DelegateLog</h1>
</header>

<div class="menu-container">

    <h2>Main Menu</h2>

    <p>Welcome to the DelegateLog Client Management System.</p>

    <div class="menu-actions">

        <a class="button" th:href="@{/client/add}">
            Add New Client
        </a>

        <a class="button" th:href="@{/clients}">
            View All Clients
        </a>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button type="submit" class="button-secondary">
                Logout
            </button>
        </form>

    </div>

</div>

</body>
</html>
