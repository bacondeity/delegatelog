<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>com.example.delegatelog.model.Client Form</title>
    <link rel="stylesheet" href="clientform.css"/>
</head>
<body>
<header>
    <nav>
        <a href="#Main Menu">Login Menu</a>
    </nav>
</header>
<br>
<section>
    <form method="post" action="/user/add" th:object="${user}">
    <fieldset>
        <legend>Delegate Registration Form</legend>
        <p><label>Delegate name: </label><input type="text" placeholder="First Name" th:field="*{ufname}"/><input type="text" placeholder="Last Name" th:field="*{ulname}"/></p>
        <p><label>Delegate e-mail: </label><input type="text" placeholder="E-Mail..." th:field="*{email}"/></p>
        <p><label>Set password: </label><input type="password" th:field="*{pw}"/></p>
        <p><button type="submit">Save Delegate</button> <button type="reset">Clear Form</button></p>
    </fieldset>
    </form>
</section>
</body>
</html>
