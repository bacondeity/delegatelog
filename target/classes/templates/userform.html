<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>com.example.delegatelog.model.Client Form</title>
    <link rel="stylesheet" href="clientform.css"/>
</head>
<body>
<header>
    <nav>
        <a href="#Main Menu">Login Menu</a>
    </nav>
</header>
<br>
<section>
    <form method="post" action="http://localhost:8080"/>
    <fieldset>
        <legend>Delegate Registration Form</legend>
        <p><label>Delegate name: </label><input type="text" placeholder="First Name"/><input type="text" placeholder="Last Name"/></p>
        <p><label>Delegate e-mail: </label><input type="text" placeholder="E-Mail..."/></p>
        <p><label>Set password: </label><input type="password"/></p>
        <p><input type="submit" text="Save"/> <input type="reset" text="Clear Form"/></p>
    </fieldset>
</section>
</body>
</html>
